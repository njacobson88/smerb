org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# workmanager: the one-off "drain" upload task runs as a dataSync foreground
# service (quiet notification only while a backlog uploads). Opt-in flag that
# adds FOREGROUND_SERVICE_DATA_SYNC to the merged manifest — see
# lib/features/sync/services/background_upload_scheduler.dart.
workmanager.enableDataSyncForegroundService=true
